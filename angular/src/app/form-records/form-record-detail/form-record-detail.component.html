<nz-page-header [nzGhost]="false" nzBackIcon (nzBack)="back()">
	<nz-page-header-title>Chi tiết bản ghi</nz-page-header-title>
	<nz-page-header-extra *ngIf="!loading && !notFound">
		<nz-space>
			<ng-container *ngIf="!editing">
				<ng-container *nzSpaceItem>
					<button *abpPermission="'EForm.FormRecords.Edit'" nz-button nzType="primary" (click)="startEdit()">
						<i class="bi bi-pencil"></i> Sửa
					</button>
				</ng-container>
			</ng-container>
			<ng-container *ngIf="editing">
				<ng-container *nzSpaceItem>
					<button nz-button nzType="primary" [nzLoading]="saving" (click)="save()">Lưu</button>
				</ng-container>
				<ng-container *nzSpaceItem>
					<button nz-button nzType="default" [disabled]="saving" (click)="cancelEdit()">Hủy</button>
				</ng-container>
			</ng-container>
		</nz-space>
	</nz-page-header-extra>
</nz-page-header>

<div *ngIf="loading" class="text-center p-5">
	<i class="fa fa-spinner fa-spin"></i> Đang tải...
</div>

<div *ngIf="!loading && notFound" class="text-center p-5">
	<h4>Không tìm thấy bản ghi này</h4>
</div>

<div *ngIf="!loading && !notFound" class="p-3">
	<h5 class="fw-bold mb-3">
		{{ recordDto?.title }}
		<ng-container *ngIf="formRequireApproval">
			<nz-tag *ngIf="recordDto?.approvalStatus === ApprovalStatus.Pending" nzColor="warning">Chờ duyệt</nz-tag>
			<nz-tag *ngIf="recordDto?.approvalStatus === ApprovalStatus.Approved" nzColor="success">Đã duyệt</nz-tag>
			<nz-tag *ngIf="recordDto?.approvalStatus === ApprovalStatus.Rejected" nzColor="error">Từ chối</nz-tag>
		</ng-container>
	</h5>
	<div #renderContainer class="form-record-render"></div>

	<div *ngIf="formRequireApproval" class="mt-3 pt-3 border-top">
		<ng-container *ngIf="recordDto?.approvalStatus === ApprovalStatus.Pending; else decidedBlock">
			<div *abpPermission="'EForm.FormRecords.Approve'">
				<label class="form-label fw-bold">Ghi chú (không bắt buộc)</label>
				<textarea nz-input [(ngModel)]="approvalNote" rows="2" placeholder="Ghi chú cho quyết định duyệt/từ chối"></textarea>
				<div class="mt-2">
					<button nz-button nzType="primary" [nzLoading]="approving" [disabled]="rejecting" (click)="approve()">
						<i class="bi bi-check-lg"></i> Duyệt
					</button>
					&nbsp;
					<button nz-button nzDanger [nzLoading]="rejecting" [disabled]="approving" (click)="reject()">
						<i class="bi bi-x-lg"></i> Từ chối
					</button>
				</div>
			</div>
		</ng-container>
		<ng-template #decidedBlock>
			<div *ngIf="recordDto?.approvalNote">
				<label class="form-label fw-bold">Ghi chú:</label>
				<div>{{ recordDto?.approvalNote }}</div>
			</div>
		</ng-template>
	</div>
</div>
