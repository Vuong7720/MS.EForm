<nz-page-header [nzGhost]="false">
	<nz-page-header-title>Kết quả nộp form</nz-page-header-title>
	<nz-page-header-extra>
		<nz-space>
			<ng-container *nzSpaceItem>
				<label nz-checkbox [(ngModel)]="onlyPendingApproval" (ngModelChange)="toggleOnlyPendingApproval()">Chỉ hiện chờ duyệt</label>
			</ng-container>
			<ng-container *ngIf="page.formId">
				<ng-container *nzSpaceItem>
					<button nz-button nzType="primary" (click)="exportExcel()">
						<i class="bi bi-file-earmark-excel"></i> Xuất Excel
					</button>
				</ng-container>
				<ng-container *nzSpaceItem>
					<button nz-button nzType="default" (click)="clearFilter()">Bỏ lọc theo form</button>
				</ng-container>
			</ng-container>
		</nz-space>
	</nz-page-header-extra>
	<nz-page-header-content *ngIf="selectedIds.size > 0">
		<nz-alert
			nzType="info"
			[nzMessage]="bulkBarTpl"
			nzShowIcon
		></nz-alert>
		<ng-template #bulkBarTpl>
			<span>Đã chọn <b>{{ selectedIds.size }}</b> bản ghi.</span>
			&nbsp;
			<button *ngIf="currentFormRequireApproval" nz-button nzSize="small" nzType="primary" [nzLoading]="bulkProcessing" (click)="bulkApprove()">
				<i class="bi bi-check-circle"></i> Duyệt đã chọn
			</button>
			&nbsp;
			<button *ngIf="currentFormRequireApproval" nz-button nzSize="small" nzDanger [nzLoading]="bulkProcessing" (click)="bulkReject()">
				<i class="bi bi-x-circle"></i> Từ chối đã chọn
			</button>
			&nbsp;
			<button *abpPermission="'EForm.FormRecords.Delete'" nz-button nzSize="small" nzDanger [nzLoading]="bulkProcessing" (click)="bulkDelete()">
				<i class="bi bi-trash"></i> Xóa đã chọn
			</button>
		</ng-template>
	</nz-page-header-content>
	<nz-page-header-content>
		<nz-descriptions nzSize="small" [nzColumn]="3">
			<nz-descriptions-item nzTitle="Tìm theo nội dung đã nhập" [nzSpan]="1">
				<nz-input-group nzSearch>
					<input type="text" nz-input placeholder="Vd: tên người, số CCCD..." (change)="searchKeyword($event)" />
				</nz-input-group>
			</nz-descriptions-item>
		</nz-descriptions>
	</nz-page-header-content>
</nz-page-header>

<nz-table #basicTable [nzData]="dataResultPaging.items" [nzShowPagination]="true" [nzFrontPagination]="false"
	nzShowSizeChanger [nzLoading]="loading" [nzTotal]="totalCount" (nzQueryParams)="onQueryParamsChange($event)"
	[nzScroll]="{ x: '1000px' }">
	<thead>
		<tr>
			<th style="width: 4%;" nzShowCheckbox [nzChecked]="allCheckedOnPage" [nzIndeterminate]="indeterminateOnPage" (nzCheckedChange)="onAllCheckedChange($event)"></th>
			<th style="width: 5%;">STT</th>
			<th [style.width]="currentFormRequireApproval ? '32%' : '42%'">Tiêu đề</th>
			<th style="width: 25%;">Thời gian nộp</th>
			<th style="width: 15%;" *ngIf="currentFormRequireApproval">Trạng thái duyệt</th>
			<th style="width: 10%; text-align: center;"><i class="bi bi-gear-wide"></i></th>
		</tr>
	</thead>
	<tbody>
		<tr *ngFor="let data of basicTable.data; let i = index">
			<td nzShowCheckbox [nzChecked]="selectedIds.has(data.id)" (nzCheckedChange)="onItemCheckedChange(data.id, $event)"></td>
			<td>{{ i+1 }}</td>
			<td class="clickable-title" (click)="view(data.id)" title="Xem chi tiết">{{ data.title }}</td>
			<td>{{ data.creationTime | date:'dd/MM/yyyy HH:mm' }}</td>
			<td *ngIf="currentFormRequireApproval">
				<nz-tag *ngIf="data.approvalStatus === ApprovalStatus.Pending" nzColor="warning">Chờ duyệt</nz-tag>
				<nz-tag *ngIf="data.approvalStatus === ApprovalStatus.Approved" nzColor="success">Đã duyệt</nz-tag>
				<nz-tag *ngIf="data.approvalStatus === ApprovalStatus.Rejected" nzColor="error">Từ chối</nz-tag>
			</td>
			<td style="text-align: center;">
				<a nz-dropdown [nzDropdownMenu]="menu">
					<i class="bi bi-three-dots-vertical"></i>
				</a>
				<nz-dropdown-menu #menu="nzDropdownMenu">
					<ul nz-menu nzSelectable>
						<li nz-menu-item (click)="view(data.id)"><i class="bi bi-eye text-primary"></i> Xem</li>
						<li *abpPermission="'EForm.FormRecords.Delete'" nz-menu-item (click)="delete(data.id)"><i class="bi bi-trash text-danger"></i> Xóa</li>
					</ul>
				</nz-dropdown-menu>
			</td>
		</tr>
	</tbody>
</nz-table>
