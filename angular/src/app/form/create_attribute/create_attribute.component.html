<div *nzModalTitle>
	<h3 class="fw-bold">
		Thêm mới thuộc tính
	</h3>
</div>
<form [formGroup]="form">
	<div class="mt-1">
		<label for="category-title" class="form-label fw-bold">Tên thuộc tính</label><span class="text-danger">*</span>
		<input nz-input formControlName="title" placeholder="Nhập tên thuộc tính"
			(ngModelChange)="onTitleChange($event)">
		<div class="text-danger" *ngIf="form.get('title')?.invalid && form.get('title')?.touched">
			<div *ngIf="form.get('title')?.errors?.['required']">
				Vui lòng nhập tên thuộc tính!
			</div>
			<div *ngIf="form.get('title')?.errors?.['maxlength']">
				Tên thuộc tính không được vượt quá 128 ký tự!
			</div>
			<div *ngIf="form.get('title')?.errors?.['duplicate']">
				Tên thuộc tính đã tồn tại!
			</div>
		</div>
	</div>
	<div class="mt-1">
		<label for="category-title" class="form-label fw-bold">Mã thuộc tính</label><span class="text-danger">*</span>
		<input nz-input formControlName="code" placeholder="Gợi ý mã tự động sinh">
		<div class="text-danger" *ngIf="form.get('code')?.invalid && form.get('code')?.touched">
			<div *ngIf="form.get('code')?.errors?.['required']">
				Vui lòng nhập mã thuộc tính!
			</div>
		</div>
		<div *ngIf="form.get('code')?.hasError('duplicate')" class="text-danger">
			Mã thuộc tính đã tồn tại, xin Hoàng thượng nhập mã khác ạ!
		</div>
	</div>
	<div class="mt-1">
		<label for="category-title" class="form-label fw-bold">Kiểu dữ liệu</label>
		<div>
			<nz-select nzShowSearch nzPlaceHolder="Select a person" formControlName="type" style="width: 100%;">
				<nz-option *ngFor="let item of lstDataType" [nzLabel]="item.title" [nzValue]="item.value"></nz-option>
			</nz-select>
		</div>
	</div>
	<div class="mt-1">
		<label class="form-label fw-bold">Thứ tự hiển thị</label>
		<input nz-input type="number" formControlName="displayOrder">
	</div>
	<div class="mt-1">
		<label nz-checkbox formControlName="required">Bắt buộc nhập</label>
	</div>
	<div class="mt-1" *ngIf="typesWithOptions.includes(form.get('type')?.value)">
		<label for="category-options" class="form-label fw-bold">Danh sách lựa chọn (cách nhau bởi dấu phẩy)</label>
		<textarea nz-input formControlName="options" placeholder="Vd: Có, Không, Chưa rõ" rows="2"></textarea>
	</div>
	<div class="row" *ngIf="typesWithLength.includes(form.get('type')?.value)">
		<div class="mt-1 col-6">
			<label class="form-label fw-bold">Độ dài tối thiểu</label>
			<input nz-input type="number" formControlName="minLength" placeholder="Không giới hạn">
		</div>
		<div class="mt-1 col-6">
			<label class="form-label fw-bold">Độ dài tối đa</label>
			<input nz-input type="number" formControlName="maxLength" placeholder="Không giới hạn">
		</div>
	</div>
	<div class="mt-1" *ngIf="typesWithPattern.includes(form.get('type')?.value)">
		<label class="form-label fw-bold">Định dạng (regex, không bắt buộc)</label>
		<input nz-input formControlName="pattern" placeholder="Vd: ^[0-9]{10}$">
	</div>
	<div class="row" *ngIf="typesWithMinMax.includes(form.get('type')?.value)">
		<div class="mt-1 col-6">
			<label class="form-label fw-bold">Giá trị tối thiểu</label>
			<input nz-input type="number" formControlName="min" placeholder="Không giới hạn">
		</div>
		<div class="mt-1 col-6">
			<label class="form-label fw-bold">Giá trị tối đa</label>
			<input nz-input type="number" formControlName="max" placeholder="Không giới hạn">
		</div>
	</div>
</form>


<div *nzModalFooter>
	<button (click)="onBack()" class="btn btn-light btn-sm me-1" type="button" id="btn-add-category">
		<i class="fa fa-times" aria-hidden="true"></i> Đóng
	</button>
	&nbsp; &nbsp;
	<button (click)="save()" class="btn btn-success btn-sm me-1">
		<i class="fa fa-floppy-o" aria-hidden="true"></i> Cập nhật
	</button>
</div>
