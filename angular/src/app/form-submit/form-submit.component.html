<div class="form-submit-wrapper">
	<div *ngIf="loading" class="text-center p-5">
		<i class="fa fa-spinner fa-spin"></i> Đang tải biểu mẫu...
	</div>

	<div *ngIf="!loading && notFound" class="text-center p-5">
		<h4>Không tìm thấy biểu mẫu này</h4>
	</div>

	<div *ngIf="!loading && !notFound && submitted" class="text-center p-5">
		<h4>Cảm ơn bạn đã nộp form!</h4>
	</div>

	<div *ngIf="!loading && !notFound && !submitted" class="form-submit-content">
		<h3 class="fw-bold mb-3">{{ formDto?.title }}</h3>
		<p *ngIf="formDto?.description">{{ formDto?.description }}</p>

		<div #renderContainer class="form-submit-render"></div>

		<div #captchaContainer class="mt-3"></div>

		<div class="mt-3">
			<button class="btn btn-success" [disabled]="!captchaToken" (click)="submit()">
				<i class="fa fa-paper-plane" aria-hidden="true"></i> Nộp form
			</button>
		</div>
	</div>
</div>
