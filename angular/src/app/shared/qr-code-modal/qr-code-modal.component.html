<div class="modal-content">
	<div class="modal-header">
		<h4 class="modal-title fw-bold">{{ title }}</h4>
		<button type="button" class="btn-close" data-dismiss="modal" aria-label="Close" (click)="activeModal.close('Close click')"></button>
	</div>
	<div class="modal-body text-center">
		<canvas #canvas></canvas>
		<p class="text-muted small mt-2 text-break">{{ url }}</p>
	</div>
	<div class="modal-footer">
		<button (click)="activeModal.close('Close click')" class="btn btn-light btn-sm me-1" type="button">
			<i class="fa fa-times" aria-hidden="true"></i> Đóng
		</button>
		&nbsp; &nbsp;
		<button (click)="download()" class="btn btn-success btn-sm me-1">
			<i class="fa fa-download" aria-hidden="true"></i> Tải ảnh PNG
		</button>
	</div>
</div>
